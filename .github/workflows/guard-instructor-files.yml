# Guard against instructor-only material ever being tracked in this PUBLIC student-facing repo.
# It lives ONLY in the private TCU-DCDA/WRIT20833_2026_instructor repo: answer keys, every notebook
# builder, the code-along *_complete copies, planning/ (including the Code Guide tutor-prompt
# drafts), reference/, the D2L generators, CLAUDE.md. Also raw TCU Online (D2L) exports and built
# cartridges, which carry the course's org-unit id. A pull after a history rewrite reintroduced
# keys once (2026-06); this check makes a recurrence fail loudly.
name: Guard instructor-only files

on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if instructor-only files are tracked
        run: |
          hits=$(git ls-files -- '*_ANSWER_KEY.ipynb' '*_complete.ipynb' '*_build_*.py' \
                   'planning/*' 'reference/*' 'd2l/*' 'CLAUDE.md' '*CHATBOT_TUTOR*' \
                   'D2LExport_*' '*.imscc')
          if [ -n "$hits" ]; then
            echo "::error::Instructor-only files are tracked in this public repo:"
            echo "$hits"
            echo "Remove them (git rm) — they belong only in the private instructor repo."
            exit 1
          fi
          echo "OK — no instructor-only files tracked."
